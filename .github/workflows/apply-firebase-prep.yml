name: Apply Firebase Prep Patch

on:
  push:
    paths:
      - ".github/workflows/apply-firebase-prep.yml"
      - "firebase-prep.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply one-line patch
        run: git apply firebase-prep.patch

      - name: Remove temporary patch assets
        run: |
          rm firebase-prep.patch
          rm .github/workflows/apply-firebase-prep.yml

      - name: Commit completed Firebase preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add one_line_diagram.js firebase-prep.patch .github/workflows/apply-firebase-prep.yml
          git commit -m "Apply Firebase-ready one-line engine updates"
          git push origin main
