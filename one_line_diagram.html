<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  />

  <meta
    http-equiv="Pragma"
    content="no-cache"
  />

  <meta
    http-equiv="Expires"
    content="0"
  />

  <title>NEXUS One-Line Workspace</title>

  <link
    rel="stylesheet"
    href="one_line_diagram.css?v=4"
  />
</head>

<body class="one-line-standalone-page">

  <main
    id="oneLineWorkspaceHost"
    class="one-line-host"
    aria-label="NEXUS One-Line Diagram editing workspace"
  >
    <section
      id="oneLineLoadingState"
      class="one-line-loading-state"
      role="status"
      aria-live="polite"
    >
      <h1>NEXUS One-Line Workspace</h1>
      <p>Loading the diagram editor...</p>
    </section>
  </main>

  <script src="one_line_storage.js?v=4"></script>
  <script src="one_line_diagram.js?v=4"></script>

  <script>
    (function initializeOneLineWorkspace() {
      "use strict";

      function showStartupFailure(message, error) {
        const host = document.getElementById(
          "oneLineWorkspaceHost"
        );

        if (error) {
          console.error(
            "[NEXUS One-Line] Startup failure:",
            error
          );
        }

        if (!host) {
          return;
        }

        host.innerHTML = "";

        const panel = document.createElement("section");
        panel.className = "one-line-startup-error";
        panel.setAttribute("role", "alert");

        const heading = document.createElement("h1");
        heading.textContent =
          "One-Line Workspace Unavailable";

        const description = document.createElement("p");
        description.textContent = message;

        const fileHelp = document.createElement("p");
        fileHelp.textContent =
          "Required files: one_line_diagram.html, " +
          "one_line_diagram.css, one_line_diagram.js, " +
          "and one_line_storage.js.";

        const consoleHelp = document.createElement("p");
        consoleHelp.textContent =
          "Press F12 and open the Console tab for the exact error.";

        panel.appendChild(heading);
        panel.appendChild(description);
        panel.appendChild(fileHelp);
        panel.appendChild(consoleHelp);

        host.appendChild(panel);
      }

      function startWorkspace() {
        const host = document.getElementById(
          "oneLineWorkspaceHost"
        );

        if (!host) {
          console.error(
            "[NEXUS One-Line] Workspace host was not found."
          );

          return;
        }

        if (
          !window.NexusOneLineStorage ||
          typeof window.NexusOneLineStorage.load !== "function" ||
          typeof window.NexusOneLineStorage.save !== "function"
        ) {
          showStartupFailure(
            "The diagram storage system could not be loaded. " +
            "Confirm that one_line_storage.js is in the same folder."
          );

          return;
        }

        if (
          !window.NEXUS ||
          !window.NEXUS.OneLine ||
          typeof window.NEXUS.OneLine.mount !== "function"
        ) {
          showStartupFailure(
            "The One-Line diagram engine could not be loaded. " +
            "Confirm that one_line_diagram.js is in the same folder " +
            "and contains window.NEXUS.OneLine.mount()."
          );

          return;
        }

        try {
          /*
           * Do not pass an empty equipment array here.
           *
           * When no equipment property is supplied, the standalone
           * editor can use the sample equipment contained inside the
           * diagram engine.
           *
           * The Ohio dashboard will later pass:
           *
           * equipment: dashboardEquipment
           */
          const controller = window.NEXUS.OneLine.mount({
            container: host,

            mode: "edit",

            projectId: "sample-project",

            buildingId: "A",

            diagramId: "overall",

            onOpenEquipment: function handleOpenEquipment(
              equipmentOrId
            ) {
              let equipmentId = "";

              if (typeof equipmentOrId === "string") {
                equipmentId = equipmentOrId;
              } else if (
                equipmentOrId &&
                typeof equipmentOrId === "object"
              ) {
                equipmentId =
                  equipmentOrId.equipmentId ||
                  equipmentOrId.id ||
                  "";
              }

              if (!equipmentId) {
                console.warn(
                  "[NEXUS One-Line] No equipment ID was provided."
                );

                return;
              }

              const url =
                "equipment.html?eq=" +
                encodeURIComponent(equipmentId);

              window.open(
                url,
                "_blank",
                "noopener,noreferrer"
              );
            },

            onSave: function handleDiagramSave(saveResult) {
              console.info(
                "[NEXUS One-Line] Diagram saved.",
                saveResult
              );
            },

            onError: function handleDiagramError(error) {
              console.error(
                "[NEXUS One-Line] Component error:",
                error
              );
            }
          });

          /*
           * Keep a reference available for browser-console testing.
           *
           * Example:
           * window.nexusOneLineWorkspace.fitDiagram()
           */
          window.nexusOneLineWorkspace =
            controller || null;

          const loadingState = document.getElementById(
            "oneLineLoadingState"
          );

          if (
            loadingState &&
            loadingState.isConnected
          ) {
            loadingState.remove();
          }

          console.info(
            "[NEXUS One-Line] Workspace mounted successfully."
          );
        } catch (error) {
          showStartupFailure(
            "The One-Line workspace could not start.",
            error
          );
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          startWorkspace,
          { once: true }
        );
      } else {
        startWorkspace();
      }
    })();
  </script>
</body>
</html>
